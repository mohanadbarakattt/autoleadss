<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLeadss — Website, Ads &amp; Social Media Management in UAE &amp; Egypt</title>
    <!--
      data-rh="true" below is LOAD-BEARING, not decoration. react-helmet-async
      only reconciles tags carrying that marker, so without it every route that
      sets a description/og:title merely APPENDED a second tag beside these —
      and crawlers read the first one, i.e. this generic marketing copy, on
      every published merchant page. Marking them lets Helmet adopt and replace
      them. These tags stay here (rather than moving into Helmet) because a
      crawler that doesn't run JS sees only this raw HTML.
      Mark ONLY tags that src/components/DefaultSeo.tsx also renders — a marked
      tag that nothing re-asserts is DELETED on the first Helmet render.
      Values must stay byte-identical to DefaultSeo.tsx's.
    -->
    <meta name="description" data-rh="true" content="One package, $1,500/month: website build or redesign, AI chatbot, weekly ad management with $500 ad spend included, and 3 social posts a week. Free 30-minute call.">
    <!--
      The `keywords` meta tag was removed on 2026-08-15. Google has not used it
      since 2009 and says so explicitly in its SEO Starter Guide, so it was pure
      weight that also leaked our target-keyword list to competitors. Do not
      re-add it. Relevance comes from the visible copy, not a hidden list.
      https://developers.google.com/search/docs/fundamentals/seo-starter-guide
    -->
    <meta name="google-site-verification" content="FZa9T-HGhkkbLW1er9dCvDqJg_OectZ0SjFr58VG16M" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:title" data-rh="true" content="AutoLeadss — Website, Ads &amp; Social Media Management in UAE &amp; Egypt">
    <meta property="og:description" data-rh="true" content="One package, $1,500/month: website build or redesign, AI chatbot, weekly ad management with $500 ad spend included, and 3 social posts a week. Free 30-minute call.">
    <meta property="og:url" data-rh="true" content="https://autoleadss.com" />
    <meta property="og:type" data-rh="true" content="website" />
    <meta property="og:image" data-rh="true" content="https://autoleadss.com/og-image.png" />
    <!-- og:image:width/height deliberately dropped: a published storefront can
         override og:image with a real product photo whose dimensions we don't
         know, and a WRONG size hint crops badly on some unfurlers. Every major
         unfurler fetches and measures the image itself. -->

    <!-- Twitter -->
    <meta name="twitter:card" data-rh="true" content="summary_large_image" />
    <meta name="twitter:title" data-rh="true" content="AutoLeadss — Website, Ads &amp; Social Media Management in UAE &amp; Egypt">
    <meta name="twitter:description" data-rh="true" content="One package, $1,500/month: website build or redesign, AI chatbot, weekly ad management with $500 ad spend included, and 3 social posts a week. Free 30-minute call.">
    <meta name="twitter:image" data-rh="true" content="https://autoleadss.com/og-image.png">

    <!-- hreflang (canonical set per-route via Helmet) -->
    <link rel="alternate" hreflang="en" href="https://autoleadss.com/en" />
    <link rel="alternate" hreflang="ar" href="https://autoleadss.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://autoleadss.com/en" />

    <!--
      JSON-LD Structured Data.

      The price here is duplicated from src/agency/offer.ts because static HTML
      cannot import from TypeScript. src/agency/offer.structured-data.test.ts
      parses this block and fails if the two ever disagree — structured data
      that contradicts the visible price is a Google spam-policy problem, not
      just a tidiness one.

      Everything asserted below is visible on the page, which is the rule for
      structured data: no claim here that a visitor cannot also read.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "AutoLeadss",
        "url": "https://autoleadss.com",
        "email": "info@autoleadss.com",
        "description": "A done-for-you growth agency for UAE and Egypt businesses. One package includes a website build or redesign, an AI chatbot, weekly ad management with ad spend included, and social media management.",
        "areaServed": ["AE", "EG"],
        "knowsLanguage": ["en", "ar"],
        "serviceType": ["Web Design", "Web Development", "Social Media Management", "Advertising Campaign Management", "AI Chatbot Development"],
        "makesOffer": {
          "@type": "Offer",
          "name": "AutoLeadss growth package",
          "price": "1500",
          "priceCurrency": "USD",
          "description": "Monthly package: website build or redesign, AI chatbot, weekly ad management with 500 USD of ad spend included, and 3 social posts a week.",
          "availability": "https://schema.org/InStock",
          "eligibleCustomerType": "https://schema.org/Business",
          "itemOffered": {
            "@type": "Service",
            "name": "Done-for-you growth package",
            "serviceType": "Digital Marketing",
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "What is included every month",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "3 social posts a week — UGC, showcase, informative and avatar formats" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "A new ad campaign every week, managed end to end" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website built or redesigned, hosted and kept current" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI chatbot answering customers 24/7" } }
              ]
            }
          }
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AutoLeadss",
        "url": "https://autoleadss.com"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- Critical: Switzer & General Sans (above-the-fold) -->
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&f[]=general-sans@600,700&display=swap" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&f[]=general-sans@600,700&display=swap" />
    <!-- Non-critical fonts loaded async -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <!-- Suite v2 (dark-luxe) fonts: Cormorant Garamond + Inter, and Amiri for the Arabic display fallback -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
